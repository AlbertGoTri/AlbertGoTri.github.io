    <!--
      Applies a saved theme BEFORE first paint. Without this the page paints
      light, then flips, and the flash is worse than having no toggle at all.
      Must stay inline and stay in <head>: an external or deferred script is
      too late. Light is the default, so only "dark" is ever written out.
    -->
    <script>
      ;(function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {
          /* private mode, blocked storage: fall through to light */
        }
      })()
    </script>
